name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # A real Postgres so the DB and pg-boss integration tests RUN instead of
    # skipping (design D-E) - skipping would silently drop coverage.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wisery_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_DATABASE_URL: postgres://postgres:postgres@localhost:5432/wisery_crm
      PGBOSS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/wisery_crm
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/wisery_crm

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
